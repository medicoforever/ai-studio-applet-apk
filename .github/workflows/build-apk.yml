name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/RADDOC-Dictation-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk final_apk/RADDOC-Dictation-Release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RADDOC-Dictation-APKs
          path: final_apk/*

      - name: Create GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "RADDOC's Dictation App v1.0.8 (Unfreeze Google Sign-In & Clean UI)"
          body: |
            ## RADDOC's Dictation App v1.0.8
            Target URL: `https://ai.studio/apps/3f0807e3-2494-4289-a3a6-c12032da731c?fullscreenApplet=true`
            
            ### Fixes in v1.0.8:
            - **Unfroze Google Sign-In Screen**: Fixed issue where the UI cleaner script inadvertently touched invisible security iframes on `accounts.google.com`. The cleaner now strictly checks the domain and never runs on Google account sign-in/auth screens, restoring full touch responsiveness.
            - **Safe AI Studio UI Cleaning**: Removed the bottom disclaimer banner and "Chat / Preview / ..." bottom bar on the AI Studio host page without modifying iframe positioning or z-index.
            - **All v1.0.7 Enhancements Included**: Native Google Drive report downloading, findings loading into editor, standalone Chrome export via FileProvider, and 24/7 background Keep-Alive service.
          files: final_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
