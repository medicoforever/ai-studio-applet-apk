name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/RADDOC-Dictation-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk final_apk/RADDOC-Dictation-Release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RADDOC-Dictation-APKs
          path: final_apk/*

      - name: Create GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "RADDOC's Dictation App v1.0.4 (Google Drive OAuth Fix)"
          body: |
            ## RADDOC's Dictation App v1.0.4
            Target URL: `https://ai.studio/apps/3f0807e3-2494-4289-a3a6-c12032da731c?fullscreenApplet=true`
            
            ### Fixes in v1.0.4:
            - **Google Drive OAuth Dialog**: Implemented an in-app OAuth Dialog window for Google Drive authentication so `window.opener` is preserved and OAuth tokens pass directly into the dictation applet without endless loading.
            - **Editor Protection**: Prevented the app from navigating to the "Remix to make this app your own" editor page by locking it to fullscreenApplet mode.
            - **Browse Drive & Links**: External links (Drive folder, Telegram support link) launch smoothly in external apps.
            - **Maintained 24/7 Keep-Alive**: Background Foreground Service and WakeLock remain active.
          files: final_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
