name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/RADDOC-Dictation-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk final_apk/RADDOC-Dictation-Release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RADDOC-Dictation-APKs
          path: final_apk/*

      - name: Create GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "RADDOC's Dictation App v1.0.7 (Report View & Drive Findings Fix)"
          body: |
            ## RADDOC's Dictation App v1.0.7
            Target URL: `https://ai.studio/apps/3f0807e3-2494-4289-a3a6-c12032da731c?fullscreenApplet=true`
            
            ### Fixes in v1.0.7:
            - **Native Google Drive Media Download & CORS Bypass**: Intercepted Google Drive `alt=media` API download requests directly in native Android code to completely bypass CORS redirect blockage on `googleusercontent.com`.
            - **"Load in App" (✏️) Fixed**: Dictation findings now import immediately into the editor when clicking the pencil button on saved cloud reports.
            - **"Open in Chrome" (🌐) Fixed**: Implemented `FileProvider` and `AndroidBridge` allowing HTML reports to launch directly into Google Chrome as standalone interactive files.
            - **In-App Report Viewer**: When viewing reports in-app, `blob:` URLs render full-screen with interactive controls and a top-bar "Open in Chrome" button.
            - **Preserved 24/7 Keep-Alive & Firebase Auth**: Foreground Service, WakeLock, and seamless Firebase Auth remain fully enabled.
          files: final_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
