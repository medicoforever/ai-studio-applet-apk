name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/RADDOC-Dictation-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk final_apk/RADDOC-Dictation-Release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RADDOC-Dictation-APKs
          path: final_apk/*

      - name: Create or Update GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "RADDOC's Dictation App v1.0.8 (Error Freeze & Chat Shift Fix)"
          body: |
            ## RADDOC's Dictation App v1.0.8
            Target URL: `https://ai.studio/apps/3f0807e3-2494-4289-a3a6-c12032da731c?fullscreenApplet=true`
            
            ### Fixes in this update:
            - **Lock Preview on Error**: Stopped AI Studio from auto-shifting from Preview to the Chat window whenever an error occurs. Doctors stay right on the error screen to view details, retry processing, or switch AI models without the app freezing or needing a restart.
            - **Offscreen Tab Enforcement**: Programmatically keeps the Preview tab active while hiding the Chat/Preview bottom bar from view.
            - **Early Error Suppression**: Silences unhandled error and rejection propagation on the AI Studio host page.
            - **Unfroze Google Sign-In**: Preserved Google account sign-in touch responsiveness.
            - **All Core Features**: Native Google Drive report downloading, findings loading into editor, standalone Chrome export via FileProvider, and 24/7 background Keep-Alive service.
          files: final_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
