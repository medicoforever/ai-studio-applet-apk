name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/AIStudio-Applet-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk final_apk/AIStudio-Applet-Release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-Applet-APKs
          path: final_apk/*

      - name: Create GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "AI Studio Applet APK v1.0.1 (Scrolling Fix)"
          body: |
            ## Always-Active AI Studio Applet APK v1.0.1
            Target URL: `https://ai.studio/apps/3f0807e3-2494-4289-a3a6-c12032da731c?fullscreenApplet=true`
            
            ### Changes in v1.0.1:
            - **Fixed Upward Scroll Issue**: Removed the conflicting swipe wrapper that was intercepting drag-down/scroll-up touch gestures inside the sandboxed applet container.
            - **Smooth Bi-directional Scrolling**: Unlocked native touch event flow for nested containers and iframes.
            - **Background Keep-Alive**: Maintained Foreground Service and WakeLock for 24/7 background activity.
          files: final_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
