name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/*.apk final_apk/RADDOC-Dictation-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk final_apk/RADDOC-Dictation-Release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RADDOC-Dictation-APKs
          path: final_apk/*

      - name: Create or Update GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "RADDOC's Dictation App v1.0.8 (Continuous Background Recording & Auto-Updater)"
          body: |
            ## RADDOC's Dictation App v1.0.8
            VERSION_CODE: 15
            Target URL: `https://ai.studio/apps/3f0807e3-2494-4289-a3a6-c12032da731c?fullscreenApplet=true`
            
            ### Fixes & Enhancements in this update:
            - **Continuous Background Audio Recording**: Fixed microphone muting and audio dropouts when minimizing the app or locking the screen. Added Android 14 `FOREGROUND_SERVICE_MICROPHONE` and background media keep-alive so the audio stream and timers record continuously just like native Android voice recorders.
            - **Native File & Report Downloads**: Fixed document and audio downloads (Word .doc/.docx, Audio WAV/WebM, RTF, HTML). Downloads are intercepted from Blob/Data URLs and saved directly to the device's public Downloads folder with MediaScanner indexing and a system notification.
            - **In-App Auto-Update Checker**: Built-in background update checker verifies the latest release from GitHub and prompts the user to download and install updates directly within the app.
            - **Microphone Permission & Recording Fixed**: Fixed microphone permission prompting at startup and on-demand in Android WebView. Cross-origin applet iframe is granted full microphone audio capture permissions policy so recording begins immediately without permission denial.
            - **Resolved Google Sign-In Infinite Loading**: Fixed hanging circular progress spinner after entering Google credentials by ensuring all OAuth, lifecycle, and token exchange redirects complete natively without interruption.
            - **Lock Preview on Error**: Stopped AI Studio from shifting away to Chat when an error occurs. Applet iframe remains 100% fullscreen on Preview so doctors can read error messages and continue dictating.
            - **Safe Clean UI**: Hidden disclaimer bar, unwanted tabs, and options menu without DOM climbing or layout breakage.
            - **All Core Features**: Native Google Drive report downloading, findings loading into editor, standalone Chrome export via FileProvider, and 24/7 background Keep-Alive service.
          files: final_apk/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
