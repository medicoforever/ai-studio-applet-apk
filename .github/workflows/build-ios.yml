name: Build iOS IPA

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Build iOS Application (.app)
        run: |
          xcodebuild -project ios/RADDOCDictation.xcodeproj \
            -scheme RADDOCDictation \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA and Zip Archive
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q RADDOC-Dictation-iOS.ipa Payload
          zip -r -q RADDOC-Dictation-iOS.app.zip "$APP_PATH"
          mkdir -p final_ipa
          mv RADDOC-Dictation-iOS.ipa final_ipa/
          mv RADDOC-Dictation-iOS.app.zip final_ipa/
          ls -la final_ipa/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RADDOC-Dictation-iOS-IPA
          path: final_ipa/*

      - name: Attach iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.8
          files: final_ipa/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
